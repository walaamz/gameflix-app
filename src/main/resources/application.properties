spring.application.name=gameflix

# MySQL connection - supports local and Docker environments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Prevent internal exception details from appearing in API responses
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# JWT authentication
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
