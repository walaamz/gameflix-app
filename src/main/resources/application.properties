spring.application.name=gameflix

# MySQL connection - supports local and Docker environments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Do not expose internal exception details in API responses
server.error.include-stacktrace=never
server.error.include-message=always

# JWT authentication
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
